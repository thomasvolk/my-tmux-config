#enable mouse support
set -g mouse on

# remap prefix from 'C-b' to 'C-s'
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix
set-option -g prefix2 C-k
bind-key C-k send-prefix

# reload config
bind r source-file ~/.tmux.conf

# VI style
# and vi style keys
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D
# supports focus events for vim or nvim
set-option -g focus-events on
# Unbind the default copy-mode key (prefix + [)
unbind [
# Bind copy-mode to prefix + Return
bind-key Enter copy-mode
# Use vi-style keybindings in copy-mode
set-window-option -g mode-keys vi
# Start selection with 'v' in copy mode
bind-key -T copy-mode-vi v send -X begin-selection
# Yank (copy) selection with 'y' in copy mode (also copies to macOS clipboard)
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
# Mouse-drag selection also copies to macOS clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
# Double-click word selection also copies to macOS clipboard
# (overrides the root-table default, which enters copy-mode itself and
# never reaches the copy-mode-vi table, so it must be bound at root level)
bind-key -n DoubleClick1Pane select-pane -t = \; copy-mode -H \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "pbcopy"
# Triple-click line selection also copies to macOS clipboard
bind-key -n TripleClick1Pane select-pane -t = \; copy-mode -H \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "pbcopy"
# Paste with 'p' (or 'P') in normal mode
bind p paste-buffer
bind P paste-buffer
setw -g mode-keys vi
 

# rebind C-s + Left to re-size panes
bind-key Left resize-pane -L 5
bind-key Right resize-pane -R 5
bind-key Up resize-pane -U 5
bind-key Down resize-pane -D 5

# new window in current path
bind c new-window -c "#{pane_current_path}"
# Pane splits should open to the same path as the current pane
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind j split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"

# toggle last window
bind Space last-window
# switch to last session
bind-key C-Space switch-client -l

# swap panes
bind-key ] swap-pane -D
bind-key [ swap-pane -U

# bind alternate session menu
bind-key k choose-session


# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# status bar
set -g status-style fg=black,bg=lightblue

# border styling
set -g pane-border-lines double
set -g pane-border-style 'fg=darkgray'
set -g pane-active-border-style 'fg=lightblue'
